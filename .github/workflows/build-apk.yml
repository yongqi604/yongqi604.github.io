name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (manual)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp -f manifest.webmanifest service-worker.js icon-192.png icon-512.png icon-maskable.png www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: npx cap sync android

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rental-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
