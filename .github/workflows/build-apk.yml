name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp -f manifest.webmanifest service-worker.js icon-192.png icon-512.png icon-maskable.png www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Write local.properties for Gradle
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set custom app icon
        run: |
          RES=android/app/src/main/res
          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${pair%%:*}"
            size="${pair##*:}"
            convert app-icon.png -resize ${size}x${size} $RES/mipmap-$density/ic_launcher.png
            convert app-icon.png -resize ${size}x${size} $RES/mipmap-$density/ic_launcher_round.png
            convert app-icon.png -resize ${size}x${size} $RES/mipmap-$density/ic_launcher_foreground.png
          done
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            convert -size 108x108 xc:"#1E6F6B" $RES/mipmap-$density/ic_launcher_background.png
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rental-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
